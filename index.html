<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0c0e11;--surface:#14171c;--surface-hover:#1a1e25;--border:#252a33;
--text:#d4d8e0;--text-dim:#7a8194;--accent:#5eead4;--accent-dim:#2a6b62;
--featured:#f0b429;--research:#5eead4;--field-note:#c084fc;
--tag-bg:rgba(94,234,212,0.1);--bookmark:#f0b429;--radius:6px;
--mono:'IBM Plex Mono',monospace;--sans:'Inter',system-ui,sans-serif;
}
html{font-size:15px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

/* Header */
.hdr{position:sticky;top:0;z-index:100;background:rgba(12,14,17,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0.5rem 1rem}
.hdr-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:0.7rem;flex-wrap:wrap}
.logo{font-family:var(--mono);font-weight:600;font-size:1rem;color:var(--accent);white-space:nowrap}.logo span{color:var(--text-dim);font-weight:400}
.srch{position:relative;flex:1;max-width:300px;min-width:150px}
.srch input{width:100%;padding:0.35rem 0.6rem 0.35rem 1.8rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font:0.83rem var(--sans);outline:0;transition:border-color .2s}
.srch input:focus{border-color:var(--accent)}.srch input::placeholder{color:var(--text-dim)}
.srch svg{position:absolute;left:0.5rem;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}

/* Countdown strip */
.cdown{max-width:860px;margin:0 auto;padding:0.5rem 1rem;font-family:var(--mono);font-size:0.78rem;color:var(--text-dim);display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap}
.cdown .pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0.15rem 0.55rem;display:inline-flex;align-items:center;gap:0.25rem;font-size:0.72rem}
.cdown .cd-time{color:var(--accent);font-weight:600}

/* Controls */
.ctrl{max-width:860px;margin:0 auto;padding:0.4rem 1rem 0;display:flex;gap:0.35rem;align-items:center;flex-wrap:wrap}
.dtab,.fbtn{font:500 0.73rem var(--mono);padding:0.3rem 0.6rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:0.35rem}
.dtab:hover,.fbtn:hover{color:var(--text);border-color:var(--text-dim)}
.dtab.on,.fbtn.on{color:var(--accent);border-color:var(--accent);background:var(--tag-bg)}
.dtab .ct{font-size:0.6rem;background:var(--border);border-radius:10px;padding:0.02rem 0.3rem}.dtab.on .ct{background:var(--accent-dim);color:var(--accent)}
.sep{width:1px;height:16px;background:var(--border);margin:0 0.15rem}
.fbtn.bm{color:var(--bookmark)!important}.fbtn.bm.on{border-color:var(--bookmark);background:rgba(240,180,41,0.1)}
.fbtn.wtt{color:var(--field-note)!important}.fbtn.wtt.on{border-color:var(--field-note);background:rgba(192,132,252,0.1)}

.main{max-width:860px;margin:0 auto;padding:0 1rem 3rem}

/* Time block */
.tblk{margin-top:1rem}
.tlbl{font:500 0.72rem var(--mono);color:var(--text-dim);padding:0.2rem 0;border-bottom:1px solid var(--border);margin-bottom:0.4rem;position:sticky;top:42px;background:var(--bg);z-index:10;display:flex;align-items:center;gap:0.4rem}
.now-b{font:600 0.6rem var(--mono);color:#ef4444;background:rgba(239,68,68,.12);padding:0.08rem 0.3rem;border-radius:3px;animation:pls 2s infinite}
.nxt-b{font:600 0.6rem var(--mono);color:var(--accent);background:var(--tag-bg);padding:0.08rem 0.3rem;border-radius:3px}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.5}}

/* Session */
.sess{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:0.35rem;overflow:hidden;transition:all .15s;position:relative}
.sess:not(.brk){cursor:pointer}.sess:not(.brk):hover{border-color:var(--text-dim);background:var(--surface-hover)}
.sess.exp{border-color:var(--accent-dim)}
.sess.is-now{border-left:3px solid #ef4444}
.sess.brk{opacity:.45;cursor:default}.sess.brk:hover{border-color:var(--border);background:var(--surface)}
.sh{padding:0.6rem 0.8rem;display:flex;gap:0.6rem;align-items:flex-start}
.sph{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--border);flex-shrink:0}
.sph.np{display:flex;align-items:center;justify-content:center;background:var(--accent-dim);color:var(--accent);font:600 0.72rem var(--mono)}
.si{flex:1;min-width:0}
.st{font-weight:600;font-size:0.9rem;line-height:1.3}
.sm{display:flex;gap:0.45rem;align-items:center;flex-wrap:wrap;margin-top:0.15rem}
.sm .sp{font-size:0.78rem;color:var(--text-dim)}
.stp{font:600 0.6rem var(--mono);padding:0.1rem 0.3rem;border-radius:3px;text-transform:uppercase;letter-spacing:.03em}
.stp.f{background:rgba(240,180,41,.15);color:var(--featured)}.stp.r{background:rgba(94,234,212,.1);color:var(--research)}.stp.fn{background:rgba(192,132,252,.1);color:var(--field-note)}
.sd{font:0.67rem var(--mono);color:var(--text-dim)}
.sr{display:flex;align-items:center;gap:0.3rem;flex-shrink:0;margin-top:0.1rem}
.chv{color:var(--text-dim);transition:transform .2s}.sess.exp .chv{transform:rotate(180deg);color:var(--accent)}
.abtn{background:0;border:0;cursor:pointer;padding:0.15rem;color:var(--text-dim);font-size:0.95rem;line-height:1;transition:all .12s}
.abtn:hover{transform:scale(1.15)}.abtn.on{color:var(--bookmark)}
.wbtn{font-size:0.85rem}.wbtn.on{color:var(--field-note)}

/* Details panel */
.det{display:none;padding:0 0.8rem 0.8rem;border-top:1px solid var(--border)}
.sess.exp .det{display:block}

/* Speaker cards */
.sc{display:flex;gap:0.6rem;align-items:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:0.6rem;margin-top:0.5rem}
.sc img,.sc .np2{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--border);flex-shrink:0}
.sc .np2{display:flex;align-items:center;justify-content:center;background:var(--accent-dim);color:var(--accent);font:600 0.75rem var(--mono)}
.sc h4{font-size:0.85rem;font-weight:600}.sc .org{font-size:0.75rem;color:var(--accent);font-family:var(--mono)}
.sc .bio{font-size:0.78rem;color:var(--text-dim);margin-top:0.3rem;line-height:1.5}
.sc .links{margin-top:0.3rem;display:flex;gap:0.5rem;font-size:0.72rem;font-family:var(--mono)}
.sc .links a{color:var(--accent)}
.sc .ff{margin-top:0.35rem;font-size:0.78rem;color:var(--text-dim);padding-left:0.5rem;border-left:2px solid var(--accent-dim)}
.conv-start{margin-top:0.4rem;padding:0.5rem;background:rgba(192,132,252,0.06);border:1px solid rgba(192,132,252,0.15);border-radius:var(--radius)}
.conv-start-label{font:600 0.68rem var(--mono);color:var(--field-note);margin-bottom:0.2rem}
.conv-start p{font-size:0.78rem;color:var(--text-dim);margin:0.15rem 0}

.abs{font-size:0.83rem;color:var(--text-dim);line-height:1.6;margin-top:0.6rem}.abs p{margin-bottom:0.4rem}

/* Notes + Rating */
.nts{margin-top:0.6rem}
.nts label{font:0.68rem var(--mono);color:var(--text-dim);display:flex;align-items:center;gap:0.25rem;margin-bottom:0.2rem}
.nts textarea{width:100%;padding:0.4rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font:0.8rem var(--sans);resize:vertical;min-height:44px;outline:0;transition:border-color .2s}
.nts textarea:focus{border-color:var(--accent)}.nts textarea::placeholder{color:var(--text-dim)}
.rating{margin-top:0.4rem;display:flex;align-items:center;gap:0.3rem}
.rating label{font:0.68rem var(--mono);color:var(--text-dim)}
.rating .stars{display:flex;gap:0.15rem}
.rating .star{background:0;border:0;font-size:1.1rem;cursor:pointer;color:var(--border);transition:color .1s;padding:0}
.rating .star.lit{color:var(--featured)}
.rating .takeaway{margin-top:0.3rem}
.rating .takeaway input{width:100%;padding:0.3rem 0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font:0.78rem var(--sans);outline:0}
.rating .takeaway input:focus{border-color:var(--accent)}.rating .takeaway input::placeholder{color:var(--text-dim)}

.no-r{text-align:center;padding:2.5rem 1rem;color:var(--text-dim);font:0.85rem var(--mono)}

/* Scroll FAB */
.fab{position:fixed;bottom:1rem;right:1rem;background:var(--accent);color:var(--bg);border:0;border-radius:20px;padding:0.35rem 0.7rem;font:600 0.72rem var(--mono);cursor:pointer;box-shadow:0 2px 12px rgba(94,234,212,.3);display:none;z-index:50;transition:transform .15s}
.fab:hover{transform:scale(1.05)}

.ftr{text-align:center;padding:1.2rem 1rem;font:0.68rem var(--mono);color:var(--text-dim);border-top:1px solid var(--border);max-width:860px;margin:0 auto}

@media(max-width:600px){
html{font-size:14px}.hdr-in{gap:.4rem}.srch{max-width:100%;order:3;flex-basis:100%}
.sh{padding:.5rem .6rem}.sph{width:32px;height:32px}.ctrl{gap:.25rem}
}
</style>

// ---- STATE ----
let aDay='d1',aFilt='all',qry='',showBM=false,showWT=false;
const S=k=>JSON.parse(localStorage.getItem('up26-'+k)||'{}');
const W=(k,v)=>localStorage.setItem('up26-'+k,JSON.stringify(v));
let bm=S('bm'),notes=S('n'),ratings=S('r'),takes=S('tk'),wtt=S('wtt');
const sk=(d,i)=>d+'-'+i;

// ---- INIT ----
(function(){
const today=new Date().toISOString().split('T')[0];
const td=D.days.find(d=>d.iso===today);if(td)aDay=td.id;
render();
document.getElementById('q').addEventListener('input',e=>{qry=e.target.value.toLowerCase().trim();renderMain()});
setInterval(updateCountdown,30000);updateCountdown();
setTimeout(scrollNow,400);
})();

function talkCount(d){return d.sessions.filter(s=>s.type!=='break').length}

function render(){renderCtrl();renderMain();updateFab()}

function renderCtrl(){
const c=document.getElementById('ctrl');
const bmC=Object.values(bm).filter(Boolean).length;
const wtC=Object.values(wtt).filter(Boolean).length;
c.innerHTML=D.days.map(d=>`<button class="dtab ${d.id===aDay?'on':''}" data-d="${d.id}">${d.label} <span class="ct">${talkCount(d)}</span></button>`).join('')+
'<div class="sep"></div>'+
['all','featured','research','field-note'].map(t=>`<button class="fbtn ${t===aFilt&&!showBM&&!showWT?'on':''}" data-t="${t}">${{all:'All',featured:'Featured',research:'Research','field-note':'Field Note'}[t]}</button>`).join('')+
`<button class="fbtn bm ${showBM?'on':''}" data-t="bm">★ ${bmC||''}</button>`+
`<button class="fbtn wtt ${showWT?'on':''}" data-t="wtt">\u{1F4AC} ${wtC||''}</button>`;
c.querySelectorAll('.dtab').forEach(b=>b.onclick=()=>{aDay=b.dataset.d;render()});
c.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{
if(b.dataset.t==='bm'){showBM=!showBM;showWT=false;aFilt='all'}
else if(b.dataset.t==='wtt'){showWT=!showWT;showBM=false;aFilt='all'}
else{aFilt=b.dataset.t;showBM=false;showWT=false}
render()});
}

function updateCountdown(){
const el=document.getElementById('cdown');
const day=D.days.find(d=>d.id===aDay);if(!day)return;
const now=new Date(),iso=day.iso,isToday=now.toISOString().split('T')[0]===iso;
const nM=now.getHours()*60+now.getMinutes();
// Find next bookmarked session
let nextBM=null;
if(isToday){
for(const s of day.sessions){
const k=sk(day.id,day.sessions.indexOf(s));
if(!bm[k]||s.type==='break')continue;
const sM=parseInt(s.t.split(':')[0])*60+parseInt(s.t.split(':')[1]);
if(sM>nM){nextBM=s;break}
}}
const pills=[`<span class="pill">\u{1F4CD} ILUMINA, Sydney</span>`,`<span class="pill">\u{1F4C5} ${day.date}</span>`];
if(nextBM){
const sM=parseInt(nextBM.t.split(':')[0])*60+parseInt(nextBM.t.split(':')[1]);
const diff=sM-nM;
pills.push(`<span class="pill">Next bookmarked: <span class="cd-time">${nextBM.title.substring(0,30)}${nextBM.title.length>30?'...':''} in ${diff}m</span></span>`);
}
el.innerHTML=pills.join('');
}

function match(s){if(!qry)return true;const h=[s.title,s.abs||'',...s.spk.map(p=>p.n+' '+p.o+' '+(p.ff||'')+' '+(p.bio||''))].join(' ').toLowerCase();return qry.split(/\s+/).every(t=>h.includes(t))}

function renderMain(){
const day=D.days.find(d=>d.id===aDay);if(!day){document.getElementById('main').innerHTML='<div class="no-r">Day not found.</div>';return}
let ss=day.sessions.map((s,i)=>({...s,_i:i}));
if(aFilt!=='all')ss=ss.filter(s=>s.type===aFilt);
if(showBM)ss=ss.filter(s=>bm[sk(day.id,s._i)]);
if(showWT)ss=ss.filter(s=>wtt[sk(day.id,s._i)]);
ss=ss.filter(match);
if(!ss.length){document.getElementById('main').innerHTML='<div class="no-r">No sessions match.</div>';updateFab();return}

const now=new Date(),isToday=day.iso===now.toISOString().split('T')[0],nM=now.getHours()*60+now.getMinutes();
let fNow=false,fNxt=false;
const gs=[];let lt=null;
ss.forEach(s=>{if(s.t!==lt){gs.push({t:s.t,e:s.e,ss:[s]});lt=s.t}else gs[gs.length-1].ss.push(s)});

document.getElementById('main').innerHTML=gs.map(g=>{
const bM=parseInt(g.t.split(':')[0])*60+parseInt(g.t.split(':')[1]);
const eM=g.e&&g.e!=='late'?parseInt(g.e.split(':')[0])*60+parseInt(g.e.split(':')[1]):bM+60;
let bdg='';const isN=isToday&&nM>=bM&&nM<eM;
if(isToday&&!fNow&&isN){bdg='<span class="now-b">NOW</span>';fNow=true}
else if(isToday&&!fNow&&!fNxt&&nM<bM){bdg='<span class="nxt-b">UP NEXT</span>';fNxt=true}
return `<div class="tblk" ${isN?'id="now-blk"':''}><div class="tlbl">${g.t}\u2013${g.e||''} ${bdg}</div>${g.ss.map(s=>rSess(s,day.id,isN)).join('')}</div>`;
}).join('');

document.querySelectorAll('.sess:not(.brk)').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('.abtn,.wbtn,.nts,.rating'))return;el.classList.toggle('exp')}));
document.querySelectorAll('.abtn').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.k;bm[k]=!bm[k];W('bm',bm);render()});
document.querySelectorAll('.wbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.k;wtt[k]=!wtt[k];W('wtt',wtt);render()});
document.querySelectorAll('.nta').forEach(t=>{t.onclick=e=>e.stopPropagation();t.oninput=()=>{notes[t.dataset.k]=t.value;W('n',notes)}});
document.querySelectorAll('.star').forEach(b=>{b.onclick=e=>{e.stopPropagation();ratings[b.dataset.k]=+b.dataset.v;W('r',ratings);renderMain()}});
document.querySelectorAll('.tki').forEach(t=>{t.onclick=e=>e.stopPropagation();t.oninput=()=>{takes[t.dataset.k]=t.value;W('tk',takes)}});
updateFab();
}

function rSess(s,dId,isN){
const isBrk=s.type==='break'&&!(s.spk&&s.spk.length&&s.spk[0].bio);
const k=sk(dId,s._i);
const tl={featured:'Featured',research:'Research','field-note':'Field Note'};
const tc={featured:'f',research:'r','field-note':'fn'};
const spN=s.spk.map(p=>p.o?`${p.n} \u00b7 ${p.o}`:p.n).join(', ');
const ph=s.spk.length>0&&s.spk[0].ph?`<img class="sph" src="${s.spk[0].ph}" alt="${s.spk[0].n}" loading="lazy">`:s.spk.length>0?`<div class="sph np">${s.spk[0].in||s.spk[0].n.split(' ').map(w=>w[0]).join('')}</div>`:'';

const cards=s.spk.map(p=>{
const lnks=[];
if(p.links){if(p.links.x)lnks.push(`<a href="https://x.com/${p.links.x.replace('@','')}" target="_blank">X: ${p.links.x}</a>`);if(p.links.li)lnks.push(`<a href="https://linkedin.com/in/${p.links.li}" target="_blank">LinkedIn</a>`);if(p.links.web)lnks.push(`<a href="https://${p.links.web}" target="_blank">${p.links.web}</a>`)}
const convHtml=p.conv&&p.conv.length?`<div class="conv-start"><div class="conv-start-label">\u{1F4AC} Conversation starters</div>${p.conv.map(c=>`<p>\u2022 ${c}</p>`).join('')}</div>`:'';
return `<div class="sc">${p.ph?`<img src="${p.ph}" alt="${p.n}" loading="lazy">`:`<div class="np2">${p.in||p.n.split(' ').map(w=>w[0]).join('')}</div>`}<div><h4>${p.n}</h4>${p.o?`<div class="org">${p.o}</div>`:''}${p.bio?`<div class="bio">${p.bio}</div>`:''}${lnks.length?`<div class="links">${lnks.join(' ')}</div>`:''}${p.ff?`<div class="ff">${p.ff}</div>`:''}${convHtml}</div></div>`;
}).join('');

const absH=s.abs?s.abs.split('\n').filter(p=>p.trim()).map(p=>`<p>${p}</p>`).join(''):'';
const r=ratings[k]||0;
const starsH=Array.from({length:5},(_, i)=>`<button class="star ${i<r?'lit':''}" data-k="${k}" data-v="${i+1}">\u2605</button>`).join('');

return `<div class="sess ${isBrk?'brk':''} ${isN&&!isBrk?'is-now':''}" data-t="${s.type}">
<div class="sh">${ph}<div class="si"><div class="st">${s.title}</div><div class="sm">${spN?`<span class="sp">${spN}</span>`:''}${tl[s.type]?`<span class="stp ${tc[s.type]}">${tl[s.type]}</span>`:''}${s.dur?`<span class="sd">${s.dur}</span>`:''}</div></div>
${!isBrk?`<div class="sr"><button class="abtn wbtn ${wtt[k]?'on':''}" data-k="${k}" title="Want to talk to">\u{1F4AC}</button><button class="abtn ${bm[k]?'on':''}" data-k="${k}" title="Bookmark">\u2605</button><svg class="chv" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>`:''}</div>
${!isBrk&&(absH||cards)?`<div class="det">${cards}${absH?`<div class="abs">${absH}</div>`:''}
<div class="nts"><label>\u{1F4DD} Notes</label><textarea class="nta" data-k="${k}" placeholder="Jot something down..." rows="2">${notes[k]||''}</textarea></div>
<div class="rating"><label>\u2B50 Rating</label><div class="stars">${starsH}</div></div>
<div class="rating takeaway"><input class="tki" type="text" data-k="${k}" placeholder="Key takeaway in one line..." value="${(takes[k]||'').replace(/"/g,'&quot;')}"></div>
</div>`:''}</div>`;
}

function scrollNow(){const el=document.getElementById('now-blk');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function updateFab(){const b=document.getElementById('fab'),el=document.getElementById('now-blk');b.style.display=el?'block':'none';b.onclick=scrollNow}
</script>

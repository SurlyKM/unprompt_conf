<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121629">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>[un]prompted II</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="notch" aria-hidden="true"></div>
<header class="chrome" id="chrome">
  <div class="row-wrap top">
    <h1 class="brand">[un]prompted <span>II</span></h1>
    <button class="status" id="status" type="button"><i class="dot"></i><span>SF time</span></button>
  </div>
  <div class="row-wrap" id="filters">
    <div class="searchline"><div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search talks and speakers" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search talks, speakers and stages">
      <button type="button" class="qclear" data-act="clearsearch" aria-label="Clear search" hidden>×</button>
    </div></div>
    <div class="seg" id="seg" role="group" aria-label="Whose sessions to show"></div>
    <div class="chipsrow"><div class="chips" id="chips" role="group" aria-label="Stages"></div></div>
  </div>
  <div class="row-wrap days" id="days" role="group" aria-label="Day"></div>
</header>

<main id="view"><p class="note">Loading the agenda…</p></main>

<nav class="tabs" aria-label="Views">
  <button type="button" data-view="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now</button>
  <button type="button" data-view="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
  <button type="button" data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>My plan</button>
</nav>

<dialog class="sheet" id="detail" aria-label="Session details"><div class="inner" id="detailInner"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:16px">This app needs JavaScript turned on.</p></noscript>
<script src="app.js"></script>
</body>
</html>
